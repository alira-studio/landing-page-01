<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 1rem; font-family: system-ui, sans-serif; background: #0b0b12; color: #f5f5f7; }
    h1 { font-size: 3rem; margin: 0; }
    canvas { display: block; width: 520px; height: 520px; max-width: 100vw; max-height: 100vw; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js" } }
  </script>
</head>
<body>
  <h1>Hello, World!</h1>
  <canvas id="scene" width="1040" height="1040"></canvas>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(2);
    renderer.setSize(1040, 1040, false);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.z = 5;

    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(2, 2, 2),
      new THREE.MeshStandardMaterial({ color: 0x7c5cff, metalness: 0.5, roughness: 0.3 })
    );
    cube.add(new THREE.LineSegments(
      new THREE.EdgesGeometry(cube.geometry),
      new THREE.LineBasicMaterial({ color: 0xffffff })
    ));
    scene.add(cube);

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const key = new THREE.PointLight(0x66ccff, 60, 20); key.position.set(3, 3, 4);
    const rim = new THREE.PointLight(0xff5c9d, 50, 20); rim.position.set(-4, -2, 3);
    scene.add(key, rim);

    renderer.setAnimationLoop((t) => {
      cube.rotation.x = t * 0.0004;
      cube.rotation.y = t * 0.0006;
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
